<header class="dashboard-header">
  <div class="header-left">
    <button class="sidebar-toggle" id="sidebarToggle" type="button" aria-label="Toggle Sidebar">
      <i class="bi bi-list"></i>
    </button>

    <div class="page-title">
      <h3 id="pageTitle">Dashboard</h3>

      <p id="pageDescription">Welcome back! Here's what's happening today.</p>
    </div>
  </div>

  <div class="header-right">
    <div class="header-divider"></div>

    <!-- ==================================================
     NOTIFICATIONS
================================================== -->

    <div class="header-notification-wrapper" id="headerNotificationWrapper">
      <button
        class="header-btn ripple"
        id="notificationButton"
        aria-label="Notifications"
        aria-expanded="false"
        aria-controls="notificationPanel"
        type="button"
      >
        <i class="bi bi-bell"></i>

        <span class="notification-badge" id="notificationBadge" aria-hidden="true"></span>
      </button>

      <!-- ==================================================
       NOTIFICATION PANEL
  ================================================== -->

      <div class="notification-panel" id="notificationPanel" aria-hidden="true">
        <!-- HEADER -->

        <div class="notification-panel-header">
          <div class="notification-header-title">
            <div class="notification-title-row">
              <h6>Notifications</h6>

              <span class="notification-count" id="notificationHeaderCount"> 0 </span>
            </div>

            <span class="notification-subtitle"> Stay updated with your team activity </span>
          </div>

          <button type="button" class="notification-mark-all" id="markAllNotificationsBtn">Mark all as read</button>
        </div>

        <!-- DIVIDER -->

        <div class="notification-panel-divider"></div>

        <!-- LIST -->

        <div class="notification-list" id="notificationList">
          <div class="notification-loading">
            <div class="spinner-border spinner-border-sm"></div>
            <span>Loading notifications...</span>
          </div>
        </div>

        <!-- EMPTY -->

        <div class="notification-empty" id="notificationEmpty" hidden>
          <div class="notification-empty-icon">
            <i class="bi bi-bell-slash"></i>
          </div>

          <div class="notification-empty-title">You're all caught up</div>

          <div class="notification-empty-text">No notifications to show.</div>
        </div>

        <!-- FOOTER -->

        <div class="notification-panel-footer" id="notificationFooter">
          <button
            type="button"
            class="notification-page-btn"
            id="notificationPreviousBtn"
            aria-label="Previous notifications"
            disabled
          >
            <i class="bi bi-chevron-left"></i>
          </button>

          <div class="notification-page-info" id="notificationPageInfo">Page 1</div>

          <button
            type="button"
            class="notification-page-btn"
            id="notificationNextBtn"
            aria-label="Next notifications"
            disabled
          >
            <i class="bi bi-chevron-right"></i>
          </button>
        </div>
        <div class="notification-panel-loading" id="notificationPanelLoading" hidden>
          <div class="notification-panel-loading-content">
            <div class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></div>
            <span id="notificationPanelLoadingText">Loading notifications...</span>
          </div>
        </div>
      </div>
    </div>

    <!-- <button class="header-btn ripple" aria-label="Messages" type="button">
            <i class="bi bi-chat-dots"></i>
        </button>


        <button class="header-btn ripple" id="themeToggle" aria-label="Toggle Theme" type="button">
            <i class="bi bi-moon-stars"></i>
        </button> -->

    <!-- ==================================================
             PROFILE
        ================================================== -->

    <div class="header-profile-wrapper" id="headerProfileWrapper">
      <button type="button" class="header-profile" id="headerProfile" aria-expanded="false">
        <div class="profile-avatar" id="headerUserAvatar">U</div>

        <div class="profile-info">
          <h6 class="name" id="headerUserName">User</h6>
          <small id="profileMenuUserRole"> Administrator </small>
        </div>

        <i class="bi bi-chevron-down profile-arrow"></i>
      </button>

      <!-- ==================================================
                 PROFILE MENU
            ================================================== -->

      <div class="profile-menu" id="profileMenu">
        <!-- Profile Header -->

        <div class="profile-menu-header">
          <div class="profile-menu-avatar" id="profileMenuUserAvatar">U</div>

          <div>
            <h6 class="username" id="profileMenuUserName"></h6>

            <small id="profileMenuUserRole"> Administrator </small>
          </div>
        </div>

        <div class="profile-menu-divider"></div>

        <!-- Account -->

        <a href="/profile" class="profile-menu-item">
          <i class="bi bi-person"></i>

          <span> My Profile </span>
        </a>

        <a href="/settings/company" class="profile-menu-item">
          <i class="bi bi-gear"></i>

          <span> Account Settings </span>
        </a>

        <div class="profile-menu-divider"></div>

        <!-- Logout -->

        <button type="button" class="profile-menu-item logout" id="logoutButton">
          <i class="bi bi-box-arrow-right"></i>

          <span> Logout </span>
        </button>
      </div>
    </div>
  </div>
</header>

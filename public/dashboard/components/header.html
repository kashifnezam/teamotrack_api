<header class="dashboard-header">

    <div class="header-left">

        <button class="sidebar-toggle" id="sidebarToggle" type="button" aria-label="Toggle Sidebar">
            <i class="bi bi-list"></i>
        </button>

        <div class="page-title">

            <h3 id="pageTitle">
                Dashboard
            </h3>

            <p id="pageDescription">
                Welcome back! Here's what's happening today.
            </p>

        </div>

    </div>


    <div class="header-right">

        <div class="header-divider"></div>


        <button class="header-btn ripple" aria-label="Notifications" type="button">
            <i class="bi bi-bell"></i>
            <span class="notification-badge"></span>
        </button>


        <button class="header-btn ripple" aria-label="Messages" type="button">
            <i class="bi bi-chat-dots"></i>
        </button>


        <button class="header-btn ripple" id="themeToggle" aria-label="Toggle Theme" type="button">
            <i class="bi bi-moon-stars"></i>
        </button>


        <!-- ==================================================
             PROFILE
        ================================================== -->

        <div class="header-profile-wrapper" id="headerProfileWrapper">

            <button type="button" class="header-profile" id="headerProfile" aria-expanded="false">

                <div class="profile-avatar" id="headerUserAvatar">
                    U
                </div>

                <div class="profile-info">

                    <h6 class="name" id="headerUserName">
                        User
                    </h6>
                    <small id="profileMenuUserRole">
                        Administrator
                    </small>

                </div>

                <i class="bi bi-chevron-down profile-arrow"></i>

            </button>


            <!-- ==================================================
                 PROFILE MENU
            ================================================== -->

            <div class="profile-menu" id="profileMenu">

                <!-- Profile Header -->

                <div class="profile-menu-header">

                    <div class="profile-menu-avatar" id="profileMenuUserAvatar">
                        U
                    </div>

                    <div>

                        <h6 class="username" d="profileMenuUserName">

                        </h6>

                        <small id="profileMenuUserRole">
                            Administrator
                        </small>

                    </div>

                </div>


                <div class="profile-menu-divider"></div>


                <!-- Account -->

                <a href="/profile" class="profile-menu-item">

                    <i class="bi bi-person"></i>

                    <span>
                        My Profile
                    </span>

                </a>


                <a href="/change-password" class="profile-menu-item">

                    <i class="bi bi-lock"></i>

                    <span>
                        Change Password
                    </span>

                </a>


                <a href="/settings/account" class="profile-menu-item">

                    <i class="bi bi-gear"></i>

                    <span>
                        Account Settings
                    </span>

                </a>


                <div class="profile-menu-divider"></div>


                <!-- Logout -->

                <button type="button" class="profile-menu-item logout" id="logoutButton">

                    <i class="bi bi-box-arrow-right"></i>

                    <span>
                        Logout
                    </span>

                </button>

            </div>

        </div>

    </div>

</header>

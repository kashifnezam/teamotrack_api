<!-- ==========================================================
     TeamoTrack Header Component
     header.html
=========================================================== -->

<header class="dashboard-header">

    <!-- Left -->
    <div class="header-left">

        <button class="sidebar-toggle" id="sidebarToggle" type="button" aria-label="Toggle Sidebar">

            <i class="bi bi-list"></i>

        </button>

        <div class="page-title">

            <h3 id="pageTitle">Dashboard</h3>

            <p id="pageDescription">
                Welcome back! Here's what's happening today.
            </p>

        </div>

    </div>

    <!-- Right -->
    <div class="header-right">

        <!-- Search -->
        <!-- <div class="header-search">

            <i class="bi bi-search"></i>

            <input type="search" placeholder="Search executives, tasks..." aria-label="Search">

        </div> -->

        <div class="header-divider"></div>

        <!-- Notifications -->
        <button class="header-btn ripple" aria-label="Notifications">

            <i class="bi bi-bell"></i>

            <span class="notification-badge"></span>

        </button>

        <!-- Messages -->
        <button class="header-btn ripple" aria-label="Messages">

            <i class="bi bi-chat-dots"></i>

        </button>

        <!-- Theme -->
        <button class="header-btn ripple" id="themeToggle" aria-label="Toggle Theme">

            <i class="bi bi-moon-stars"></i>

        </button>

        <!-- Profile -->
        <div class="header-profile">

            <div class="profile-avatar">
                KA
            </div>

            <div class="profile-info">

                <h6 class="name"></h6>

                <small>
                    Administrator
                </small>

            </div>

            <i class="bi bi-chevron-down"></i>

        </div>

    </div>

</header>

<section class="settings-page">
    <div class="container-fluid">

        <div class="settings-card">

            <div class="settings-card-header">
                <div>
                    <h5>My Profile</h5>
                    <p>Manage your personal information.</p>
                </div>
            </div>

            <div class="settings-card-body">

                <div class="profile-settings-avatar">
                    KA
                </div>

                <div class="row g-3">

                    <div class="col-md-6">
                        <label class="form-label">Full Name</label>
                        <input
                            id="fullName"
                            class="form-control"
                            type="text"
                        >
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Email</label>
                        <input
                            id="email"
                            class="form-control"
                            type="email"
                            disabled
                        >
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Mobile</label>
                        <input
                            id="mobile"
                            class="form-control"
                            type="text"
                            disabled
                        >
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Role</label>
                        <input
                            id="role"
                            class="form-control"
                            type="text"
                            disabled
                        >
                    </div>

                </div>

                <div class="mt-4">
                    <button
                        id="saveProfileBtn"
                        class="btn btn-primary"
                        onclick="saveProfile()"
                    >
                        Save Changes
                    </button>
                </div>

            </div>

        </div>

    </div>
</section>

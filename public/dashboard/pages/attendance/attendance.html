<section class="attendance-page">

    <div class="container-fluid">

        <!-- FILTER -->
        <div class="filter-card">

            <div class="row g-3 align-items-end">

                <div class="col-lg-5 col-md-6">

                    <label class="form-label">
                        Executive
                    </label>

                    <select
                        id="attendanceExecutive"
                        class="form-select"
                    >
                        <option value="">
                            Select Executive
                        </option>
                    </select>

                </div>

                <div class="col-lg-3 col-md-3">

                    <label class="form-label">
                        Month
                    </label>

                    <input
                        id="attendanceMonth"
                        type="month"
                        class="form-control"
                    >

                </div>

                <div class="col-lg-2 col-md-3">

                    <button
                        type="button"
                        class="btn btn-primary w-100"
                        id="attendanceLoadBtn"
                    >
                        <i class="bi bi-search me-1"></i>
                        Load
                    </button>

                </div>

            </div>

        </div>


        <!-- SUMMARY -->
        <div class="row g-3 mb-3">

            <div class="col-xl-2 col-md-4 col-6">
                <div class="attendance-stat">
                    <small>Present</small>
                    <strong id="presentCount">0</strong>
                </div>
            </div>

            <div class="col-xl-2 col-md-4 col-6">
                <div class="attendance-stat">
                    <small>Late</small>
                    <strong id="lateCount">0</strong>
                </div>
            </div>

            <div class="col-xl-2 col-md-4 col-6">
                <div class="attendance-stat">
                    <small>Half Day</small>
                    <strong id="halfDayCount">0</strong>
                </div>
            </div>

            <div class="col-xl-2 col-md-4 col-6">
                <div class="attendance-stat">
                    <small>Weekly Off</small>
                    <strong id="weeklyOffCount">0</strong>
                </div>
            </div>

            <div class="col-xl-2 col-md-4 col-6">
                <div class="attendance-stat">
                    <small>Absent</small>
                    <strong id="absentCount">0</strong>
                </div>
            </div>

            <div class="col-xl-2 col-md-4 col-6">
                <div class="attendance-stat">
                    <small>Working</small>
                    <strong id="workingTime">0h 0m</strong>
                </div>
            </div>

        </div>


        <!-- TABLE -->
        <div class="attendance-card">

            <div class="attendance-card-header">

                <h6 class="mb-0">
                    Attendance Records
                </h6>

                <span id="attendanceCount">
                    0 Records
                </span>

            </div>


            <div class="table-responsive">

                <table class="table align-middle mb-0">

                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Check In</th>
                            <th>Check Out</th>
                            <th>Working Time</th>
                            <th>Status</th>
                        </tr>
                    </thead>

                    <tbody id="attendanceTable">

                        <tr>
                            <td
                                colspan="5"
                                class="empty-state"
                            >
                                Select an executive
                            </td>
                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</section>

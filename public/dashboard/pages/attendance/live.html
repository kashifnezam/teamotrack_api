<section class="live-tracking-page">
  <div class="container-fluid">
    <!-- ============================================================
         HEADER / FILTER BAR
         ============================================================ -->

    <div class="tracking-header">
      <div class="tracking-page-title">
        <div class="tracking-title-icon">
          <i class="bi bi-geo-alt-fill"></i>
        </div>

        <div>
          <h5>Live Tracking</h5>
          <span>Executive movement and route history</span>
        </div>
      </div>

      <div class="tracking-filters">
        <!-- TEAM -->
        <div class="tracking-filter">
          <label for="liveTeam">Team</label>

          <select id="liveTeam" class="form-select">
            <option value="">All Teams</option>
          </select>
        </div>

        <!-- EXECUTIVE -->
        <div class="tracking-filter executive-filter">
          <label>Executive</label>

          <div class="tracking-select" id="liveExecutiveDropdown">
            <button type="button" class="tracking-select-trigger" id="liveExecutiveTrigger" aria-expanded="false">
              <span id="liveExecutiveText"> Select Executive </span>

              <i class="bi bi-chevron-down"></i>
            </button>

            <div class="tracking-select-menu hidden" id="liveExecutiveMenu">
              <div class="tracking-select-search">
                <i class="bi bi-search"></i>

                <input type="search" id="liveExecutiveSearch" placeholder="Search executive..." autocomplete="off" />
              </div>

              <div class="tracking-select-options" id="liveExecutiveOptions"></div>
            </div>

            <input type="hidden" id="liveExecutive" value="" />
          </div>
        </div>

        <!-- DATE -->
        <div class="tracking-filter tracking-date">
          <label for="liveDate">Date</label>

          <input id="liveDate" type="date" class="form-control" />
        </div>

        <!-- TRACK -->
        <button type="button" id="loadTrackingBtn" class="tracking-action">
          <i class="bi bi-crosshair"></i>
          <span>Track</span>
        </button>
      </div>
    </div>

    <!-- ============================================================
         MAP
         ============================================================ -->

    <div class="tracking-map-card">
      <div class="tracking-map-container">
        <div id="trackingMap" class="tracking-map"></div>

        <!-- MAP TOP LEFT INFO -->
        <div class="tracking-map-info" id="trackingMapInfo">
          <div class="tracking-map-info-name">
            <span class="tracking-live-dot" id="trackingLiveDot"></span>

            <strong id="trackingMapExecutive"> Select executive </strong>
          </div>

          <div class="tracking-map-info-meta">
            <span id="trackingStatusText"> Ready to track </span>
          </div>
        </div>

        <!-- MAP TOP RIGHT -->
        <div class="tracking-map-actions">
          <button type="button" id="mapExpandBtn" class="map-control-btn" title="Expand map" aria-label="Expand map">
            <i class="bi bi-arrows-fullscreen"></i>
          </button>
        </div>

        <!-- MAP BOTTOM INFO -->
        <div class="tracking-map-stats">
          <div class="map-stat">
            <span>Started</span>
            <strong id="trackingStart">--</strong>
          </div>

          <div class="map-stat">
            <span>Last location</span>
            <strong id="trackingEnd">--</strong>
          </div>

          <div class="map-stat">
            <span>Distance</span>
            <strong id="trackingDistance">0 m</strong>
          </div>
        </div>
      </div>

      <!-- ============================================================
           PLAYBACK
           ============================================================ -->

      <div class="tracking-playback">
        <div class="playback-controls">
          <button
            type="button"
            id="playBtn"
            class="playback-btn playback-play"
            aria-label="Play route"
            title="Play route"
          >
            <i class="bi bi-play-fill"></i>
          </button>

          <button type="button" id="stopBtn" class="playback-btn" aria-label="Stop playback" title="Stop playback">
            <i class="bi bi-stop-fill"></i>
          </button>
        </div>

        <div class="playback-track">
          <input id="playbackSlider" type="range" min="0" max="0" value="0" class="form-range" />

          <div class="playback-labels">
            <span>Route playback</span>

            <strong id="playbackTime">--</strong>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

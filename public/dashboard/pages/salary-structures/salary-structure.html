<section class="p-3">
  <div class="container-fluid py-3">
    <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3">
      <div>
        <h4 class="mb-1">Salary Structures</h4>
        <p class="text-muted mb-0">Create and manage salary components for payroll.</p>
      </div>

      <button id="addSalaryStructureBtn" class="btn btn-primary" type="button">
        <i class="bi bi-plus-lg me-1"></i>
        Add Structure
      </button>
    </div>

    <div class="card border-0 shadow-sm">
      <div class="card-body p-0">
        <div id="salaryStructureLoading" class="text-center py-5">
          <div class="spinner-border text-primary" role="status"></div>

          <div class="small text-muted mt-2">Loading salary structures...</div>
        </div>

        <div id="salaryStructureEmpty" class="text-center py-5 d-none">
          <i class="bi bi-wallet2 fs-1 text-muted"></i>

          <h6 class="mt-3">No salary structures</h6>

          <p class="text-muted small mb-0">Create your first salary structure.</p>
        </div>

        <div id="salaryStructureTableWrap" class="table-responsive d-none">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th>Structure</th>
                <th>Basic</th>
                <th>Allowances</th>
                <th>Deductions</th>
                <th>Status</th>
                <th class="text-end">Action</th>
              </tr>
            </thead>

            <tbody id="salaryStructureTableBody"></tbody>
          </table>
        </div>

        <div id="salaryStructureMobileList" class="d-none"></div>
      </div>
    </div>
  </div>
</section>

<!-- ==================================================
     SALARY STRUCTURE MODAL
================================================== -->

<div class="modal fade" id="salaryStructureModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content border-0 shadow">
      <div class="modal-header">
        <h5 id="salaryStructureModalTitle" class="modal-title">Add Salary Structure</h5>

        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <form id="salaryStructureForm">
        <div class="modal-body">
          <input type="hidden" id="salaryStructureId" />

          <!-- BASIC INFORMATION -->

          <div class="mb-3">
            <label class="form-label">
              Structure Name
              <span class="text-danger">*</span>
            </label>

            <input
              id="salaryStructureName"
              type="text"
              class="form-control"
              maxlength="100"
              placeholder="e.g. Field Executive Salary"
              required
            />
          </div>

          <div class="row g-3">
            <div class="col-12">
              <h6 class="border-bottom pb-2">Earnings</h6>
            </div>

            <div class="col-12 col-md-6">
              <label class="form-label">
                Basic Salary
                <span class="text-danger">*</span>
              </label>

              <input id="salaryBasic" type="number" class="form-control" min="0" step="0.01" value="0" required />
            </div>

            <div class="col-12 col-md-6">
              <label class="form-label"> HRA </label>

              <input id="salaryHra" type="number" class="form-control" min="0" step="0.01" value="0" />
            </div>

            <div class="col-12 col-md-6">
              <label class="form-label"> Conveyance </label>

              <input id="salaryConveyance" type="number" class="form-control" min="0" step="0.01" value="0" />
            </div>

            <div class="col-12 col-md-6">
              <label class="form-label"> Other Allowance </label>

              <input id="salaryOtherAllowance" type="number" class="form-control" min="0" step="0.01" value="0" />
            </div>

            <div class="col-12 col-md-6">
              <label class="form-label"> Incentive </label>

              <input id="salaryIncentive" type="number" class="form-control" min="0" step="0.01" value="0" />
            </div>

            <div class="col-12 col-md-6">
              <label class="form-label"> Overtime </label>

              <input id="salaryOvertime" type="number" class="form-control" min="0" step="0.01" value="0" />
            </div>

            <div class="col-12 mt-4">
              <h6 class="border-bottom pb-2">Deductions</h6>
            </div>

            <div class="col-12 col-md-6">
              <label class="form-label"> PF </label>

              <input id="salaryPf" type="number" class="form-control" min="0" step="0.01" value="0" />
            </div>

            <div class="col-12 col-md-6">
              <label class="form-label"> ESI </label>

              <input id="salaryEsi" type="number" class="form-control" min="0" step="0.01" value="0" />
            </div>

            <div class="col-12 col-md-6">
              <label class="form-label"> Tax </label>

              <input id="salaryTax" type="number" class="form-control" min="0" step="0.01" value="0" />
            </div>

            <div class="col-12 col-md-6">
              <label class="form-label"> Other Deduction </label>

              <input id="salaryOtherDeduction" type="number" class="form-control" min="0" step="0.01" value="0" />
            </div>

            <div class="col-12 mt-4">
              <label class="form-label"> Description </label>

              <textarea
                id="salaryDescription"
                class="form-control"
                rows="3"
                maxlength="500"
                placeholder="Optional description"
              >
              </textarea>
            </div>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>

          <button id="saveSalaryStructureBtn" type="submit" class="btn btn-primary">Save Structure</button>
        </div>
      </form>
    </div>
  </div>
</div>

<div class="container-fluid py-3">

    <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3">

        <div>
            <h4 class="mb-1">
                Payroll Calculation
            </h4>

            <p class="text-muted mb-0">
                Review calculated payroll for a payroll period.
            </p>
        </div>

        <div class="d-flex gap-2">

            <select
                id="payrollCalculationPeriod"
                class="form-select">

                <option value="">
                    Select payroll period
                </option>

            </select>

            <button
                id="calculatePayrollBtn"
                type="button"
                class="btn btn-primary text-nowrap">

                <i class="bi bi-calculator me-1"></i>
                Calculate

            </button>

        </div>

    </div>


    <!-- SUMMARY -->

    <div
        id="payrollCalculationSummary"
        class="row g-3 mb-3 d-none">

        <div class="col-6 col-lg-3">

            <div class="card border-0 shadow-sm h-100">

                <div class="card-body">

                    <div class="small text-muted">
                        Employees
                    </div>

                    <div
                        id="summaryEmployees"
                        class="fs-4 fw-semibold">
                        0
                    </div>

                </div>

            </div>

        </div>


        <div class="col-6 col-lg-3">

            <div class="card border-0 shadow-sm h-100">

                <div class="card-body">

                    <div class="small text-muted">
                        Gross Salary
                    </div>

                    <div
                        id="summaryGross"
                        class="fs-4 fw-semibold">
                        ₹0
                    </div>

                </div>

            </div>

        </div>


        <div class="col-6 col-lg-3">

            <div class="card border-0 shadow-sm h-100">

                <div class="card-body">

                    <div class="small text-muted">
                        Deductions
                    </div>

                    <div
                        id="summaryDeduction"
                        class="fs-4 fw-semibold">
                        ₹0
                    </div>

                </div>

            </div>

        </div>


        <div class="col-6 col-lg-3">

            <div class="card border-0 shadow-sm h-100">

                <div class="card-body">

                    <div class="small text-muted">
                        Net Salary
                    </div>

                    <div
                        id="summaryNet"
                        class="fs-4 fw-semibold">
                        ₹0
                    </div>

                </div>

            </div>

        </div>

    </div>


    <!-- TABLE -->

    <div class="card border-0 shadow-sm">

        <div class="card-body p-0">


            <div
                id="payrollCalculationLoading"
                class="text-center py-5">

                <div
                    class="spinner-border text-primary"
                    role="status">
                </div>

                <div class="small text-muted mt-2">
                    Select a payroll period.
                </div>

            </div>


            <div
                id="payrollCalculationEmpty"
                class="text-center py-5 d-none">

                <i class="bi bi-calculator fs-1 text-muted"></i>

                <h6 class="mt-3">
                    No payroll calculations
                </h6>

                <p class="text-muted small mb-0">
                    Calculate payroll for the selected period.
                </p>

            </div>


            <!-- DESKTOP -->

            <div
                id="payrollCalculationTableWrap"
                class="table-responsive d-none">

                <table class="table table-hover align-middle mb-0">

                    <thead class="table-light">

                        <tr>

                            <th>
                                Employee
                            </th>

                            <th>
                                Working Days
                            </th>

                            <th>
                                Payable Days
                            </th>

                            <th>
                                Gross
                            </th>

                            <th>
                                Deduction
                            </th>

                            <th>
                                Net Salary
                            </th>

                            <th>
                                Status
                            </th>

                        </tr>

                    </thead>

                    <tbody
                        id="payrollCalculationTableBody">
                    </tbody>

                </table>

            </div>


            <!-- MOBILE -->

            <div
                id="payrollCalculationMobileList"
                class="d-none">
            </div>

        </div>

    </div>

</div>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Teams | TeamoTrack</title>

    <link rel="stylesheet" href="../assets/css/common.css">
    <link rel="stylesheet" href="/dashboard/assets/css/team/teams.css">

</head>

<body>

<div class="dashboard-wrapper">

    <aside id="sidebar-container"></aside>

    <main class="dashboard-main">

        <header id="header-container"></header>

        <section class="teams-page">

            <div class="container-fluid">

                <!-- Page Header -->
                <div class="page-header">

                    <h4 class="mb-0">
                        Teams
                    </h4>

                </div>


                <!-- Filter -->
                <div class="filter-card">

                    <div class="row g-2 align-items-center">

                        <div class="col-lg-5 col-md-6">

                            <form autocomplete="off">

                                <div class="search-box">

                                    <i class="bi bi-search"></i>

                                    <input
                                        id="searchInput"
                                        type="search"
                                        class="form-control"
                                        placeholder="Search team...">

                                </div>

                            </form>

                        </div>


                        <div class="col-lg-7 text-lg-end">

                            <span class="team-count">

                                <strong id="teamCount">0</strong>
                                Teams

                            </span>

                        </div>

                    </div>

                </div>


                <!-- Team Card -->
                <div class="team-card">

                    <div class="team-card-header">

                        <h6 class="mb-0">
                            Team List
                        </h6>

                        <button
                            type="button"
                            class="btn btn-primary btn-sm"
                            onclick="openTeamModal()">

                            <i class="bi bi-plus-lg me-1"></i>
                            Add Team

                        </button>

                    </div>


                    <div class="table-responsive">

                        <table class="table align-middle mb-0">

                            <thead>

                            <tr>

                                <th>Team</th>
                                <th>Manager</th>
                                <th>Shift</th>
                                <th>Executives</th>
                                <!-- <th>Status</th> -->

                                <th class="text-end">
                                    Action
                                </th>

                            </tr>

                            </thead>


                            <tbody id="teamTable">

                            <tr>

                                <td
                                    colspan="5"
                                    class="empty-state">

                                    Loading teams...

                                </td>

                            </tr>

                            </tbody>

                        </table>

                    </div>

                </div>

            </div>

        </section>

    </main>

</div>


<!-- Team Modal -->

<div
    class="modal fade"
    id="teamModal"
    tabindex="-1">

    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content">

            <div class="modal-header">

                <h5
                    class="modal-title"
                    id="modalTitle">

                    Add Team

                </h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal">
                </button>

            </div>


            <div class="modal-body">

                <input
                    type="hidden"
                    id="teamId">


                <div class="mb-3">

                    <label class="form-label">
                        Team Name
                    </label>

                    <input
                        id="teamName"
                        type="text"
                        class="form-control"
                        placeholder="Enter team name">

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Team Manager
                    </label>

                    <select
                        id="leadId"
                        class="form-select">

                        <option value="">
                            No Manager
                        </option>

                    </select>

                </div>


                <div class="mb-2">

                    <label class="form-label">
                        Shift Policy
                    </label>

                    <select
                        id="shiftId"
                        class="form-select">

                        <option value="">
                            Select Shift
                        </option>

                    </select>

                </div>


                <div
                    id="noShiftMessage"
                    class="no-shift-message d-none">

                    <i class="bi bi-clock-history me-1"></i>

                    No shift policy found.

                    <a href="/shift">
                        Create Shift
                    </a>

                </div>

            </div>


            <div class="modal-footer">

                <button
                    type="button"
                    class="btn btn-light"
                    data-bs-dismiss="modal">

                    Cancel

                </button>

                <button
                    type="button"
                    class="btn btn-primary"
                    id="saveTeamBtn"
                    onclick="saveTeam()">

                    Save Team

                </button>

            </div>

        </div>

    </div>

</div>


<script src="/assets/js/common.js"></script>

<script src="/dashboard/assets/js/team/teams.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shifts | TeamoTrack</title>

    <link rel="stylesheet" href="../assets/css/common.css">
    <link rel="stylesheet" href="/dashboard/assets/css/team/shifts.css">

</head>

<body>

<div class="dashboard-wrapper">

    <aside id="sidebar-container"></aside>

    <main class="dashboard-main">

        <header id="header-container"></header>

        <section class="shifts-page">

            <div class="container-fluid">

                <div class="page-header">
                    <h4 class="mb-0">Shifts</h4>
                </div>

                <!-- FILTER -->
                <div class="filter-card">

                    <div class="row g-2 align-items-center">

                        <div class="col-lg-5 col-md-6">

                            <form autocomplete="off">

                                <div class="search-box">

                                    <i class="bi bi-search"></i>

                                    <input
                                        id="searchInput"
                                        type="search"
                                        class="form-control"
                                        placeholder="Search shift...">

                                </div>

                            </form>

                        </div>

                        <div class="col-lg-7 text-lg-end">

                            <span class="shift-count">
                                <strong id="shiftCount">0</strong>
                                Shifts
                            </span>

                        </div>

                    </div>

                </div>


                <!-- SHIFT CARD -->
                <div class="shift-card">

                    <div class="shift-card-header">

                        <h6 class="mb-0">
                            Shift List
                        </h6>

                        <button
                            type="button"
                            class="btn btn-primary btn-sm"
                            onclick="openShiftModal()">

                            <i class="bi bi-plus-lg me-1"></i>
                            Add Shift

                        </button>

                    </div>


                    <div class="table-responsive">

                        <table class="table align-middle mb-0">

                            <thead>

                            <tr>

                                <th>Shift</th>
                                <th>Time</th>
                                <th>Grace</th>
                                <th>Half Day</th>
                                <th>Full Day</th>
                                <th>Weekly Off</th>

                                <th class="text-end">
                                    Action
                                </th>

                            </tr>

                            </thead>

                            <tbody id="shiftTable">

                            <tr>

                                <td
                                    colspan="7"
                                    class="empty-state">

                                    Loading shifts...

                                </td>

                            </tr>

                            </tbody>

                        </table>

                    </div>

                </div>

            </div>

        </section>

    </main>

</div>


<!-- MODAL -->

<div class="modal fade" id="shiftModal" tabindex="-1">

    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title" id="modalTitle">
                    Add Shift
                </h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal">
                </button>

            </div>


            <div class="modal-body">

                <input type="hidden" id="shiftId">

                <div class="row g-3">

                    <div class="col-12">

                        <label class="form-label">
                            Shift Name
                        </label>

                        <input
                            id="shiftName"
                            type="text"
                            class="form-control"
                            placeholder="e.g. General Shift">

                    </div>


                    <div class="col-6">

                        <label class="form-label">
                            Start Time
                        </label>

                        <input
                            id="startTime"
                            type="time"
                            class="form-control">

                    </div>


                    <div class="col-6">

                        <label class="form-label">
                            End Time
                        </label>

                        <input
                            id="endTime"
                            type="time"
                            class="form-control">

                    </div>


                    <div class="col-4">

                        <label class="form-label">
                            Grace
                        </label>

                        <input
                            id="graceMinutes"
                            type="number"
                            min="0"
                            class="form-control"
                            value="0">

                    </div>


                    <div class="col-4">

                        <label class="form-label">
                            Half Day
                        </label>

                        <input
                            id="halfDayMinutes"
                            type="number"
                            min="0"
                            class="form-control"
                            value="240">

                    </div>


                    <div class="col-4">

                        <label class="form-label">
                            Full Day
                        </label>

                        <input
                            id="fullDayMinutes"
                            type="number"
                            min="0"
                            class="form-control"
                            value="480">

                    </div>


                    <div class="col-12">

                        <label class="form-label">
                            Weekly Off
                        </label>

                        <div class="weekly-off">

                            <label>
                                <input type="checkbox" value="0">
                                Sun
                            </label>

                            <label>
                                <input type="checkbox" value="1">
                                Mon
                            </label>

                            <label>
                                <input type="checkbox" value="2">
                                Tue
                            </label>

                            <label>
                                <input type="checkbox" value="3">
                                Wed
                            </label>

                            <label>
                                <input type="checkbox" value="4">
                                Thu
                            </label>

                            <label>
                                <input type="checkbox" value="5">
                                Fri
                            </label>

                            <label>
                                <input type="checkbox" value="6">
                                Sat
                            </label>

                        </div>

                    </div>

                </div>

            </div>


            <div class="modal-footer">

                <button
                    type="button"
                    class="btn btn-light"
                    data-bs-dismiss="modal">

                    Cancel

                </button>

                <button
                    type="button"
                    class="btn btn-primary"
                    id="saveShiftBtn"
                    onclick="saveShift()">

                    Save Shift

                </button>

            </div>

        </div>

    </div>

</div>


<script src="/assets/js/common.js"></script>

<script src="/dashboard/assets/js/team/shifts.js"></script>

</body>

</html>

<div class="container-fluid py-3">

    <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3">

        <div>
            <h4 class="mb-1">Salary Assignments</h4>

            <p class="text-muted mb-0">
                Assign salary structures to staff and manage salary history.
            </p>
        </div>

        <button
            id="addSalaryAssignmentBtn"
            type="button"
            class="btn btn-primary">

            <i class="bi bi-plus-lg me-1"></i>
            Assign Salary

        </button>

    </div>


    <!-- ==================================================
         DESKTOP
    ================================================== -->

    <div class="card border-0 shadow-sm">

        <div class="card-body p-0">

            <div
                id="salaryAssignmentLoading"
                class="text-center py-5">

                <div
                    class="spinner-border text-primary"
                    role="status">
                </div>

                <div class="small text-muted mt-2">
                    Loading salary assignments...
                </div>

            </div>


            <div
                id="salaryAssignmentEmpty"
                class="text-center py-5 d-none">

                <i class="bi bi-person-badge fs-1 text-muted"></i>

                <h6 class="mt-3">
                    No salary assignments
                </h6>

                <p class="text-muted small mb-0">
                    Assign a salary structure to your staff.
                </p>

            </div>


            <div
                id="salaryAssignmentTableWrap"
                class="table-responsive d-none">

                <table class="table table-hover align-middle mb-0">

                    <thead class="table-light">

                        <tr>

                            <th>
                                Employee
                            </th>

                            <th>
                                Salary Structure
                            </th>

                            <th>
                                Effective From
                            </th>

                            <th>
                                Status
                            </th>

                            <th class="text-end">
                                Action
                            </th>

                        </tr>

                    </thead>

                    <tbody
                        id="salaryAssignmentTableBody">
                    </tbody>

                </table>

            </div>


            <!-- ==================================================
                 MOBILE
            ================================================== -->

            <div
                id="salaryAssignmentMobileList"
                class="d-none">
            </div>

        </div>

    </div>

</div>


<!-- ==================================================
     ASSIGN SALARY MODAL
================================================== -->

<div
    class="modal fade"
    id="salaryAssignmentModal"
    tabindex="-1"
    aria-hidden="true">

    <div
        class="modal-dialog modal-dialog-centered">

        <div class="modal-content border-0 shadow">

            <div class="modal-header">

                <h5
                    id="salaryAssignmentModalTitle"
                    class="modal-title">

                    Assign Salary

                </h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal">
                </button>

            </div>


            <form id="salaryAssignmentForm">

                <div class="modal-body">

                    <input
                        type="hidden"
                        id="salaryAssignmentId">


                    <!-- EMPLOYEE -->

                    <div class="mb-3">

                        <label
                            for="salaryEmployee"
                            class="form-label">

                            Employee
                            <span class="text-danger">*</span>

                        </label>

                        <select
                            id="salaryEmployee"
                            class="form-select"
                            required>

                            <option value="">
                                Select employee
                            </option>

                        </select>

                    </div>


                    <!-- SALARY STRUCTURE -->

                    <div class="mb-3">

                        <label
                            for="salaryStructure"
                            class="form-label">

                            Salary Structure
                            <span class="text-danger">*</span>

                        </label>

                        <select
                            id="salaryStructure"
                            class="form-select"
                            required>

                            <option value="">
                                Select salary structure
                            </option>

                        </select>

                    </div>


                    <!-- EFFECTIVE DATE -->

                    <div class="mb-3">

                        <label
                            for="salaryEffectiveFrom"
                            class="form-label">

                            Effective From
                            <span class="text-danger">*</span>

                        </label>

                        <input
                            id="salaryEffectiveFrom"
                            type="date"
                            class="form-control"
                            required>

                        <div class="form-text">
                            Salary will apply from this date.
                        </div>

                    </div>

                </div>


                <div class="modal-footer">

                    <button
                        type="button"
                        class="btn btn-light"
                        data-bs-dismiss="modal">

                        Cancel

                    </button>

                    <button
                        id="saveSalaryAssignmentBtn"
                        type="submit"
                        class="btn btn-primary">

                        Assign Salary

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

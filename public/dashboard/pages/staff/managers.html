<section class="staff-page p-3">

    <div class="container-fluid">

        <div class="page-header">
            <div>
                <h4 class="mb-1">Managers</h4>
                <p class="text-muted mb-0">
                    Manage your manager hierarchy and permissions.
                </p>
            </div>

            <button class="btn btn-primary" onclick="openStaffModal()">
                <i class="bi bi-plus-lg me-1"></i>
                Add Manager
            </button>
        </div>


        <!-- Search -->

        <div class="filter-card">

            <div class="row g-2 align-items-center">

                <div class="col-lg-6">

                    <div class="search-box">

                        <i class="bi bi-search"></i>

                        <input id="staffSearch" type="search" class="form-control" placeholder="Search manager...">

                    </div>

                </div>

                <div class="col-lg-6 text-lg-end">

                    <span class="staff-count">
                        <strong id="staffCount">0</strong>
                        Managers
                    </span>

                </div>

            </div>

        </div>


        <!-- List -->

        <div class="staff-card">

            <div class="staff-card-header">

                <h6 class="mb-0">
                    My Managers
                </h6>

            </div>


            <div class="table-responsive">

                <table class="table align-middle mb-0">

                    <thead>
                        <tr>
                            <th>Manager</th>
                            <th>Parent</th>
                            <th>Mobile</th>
                            <th>Status</th>
                            <th class="text-end">
                                Action
                            </th>
                        </tr>
                    </thead>

                    <tbody id="staffTable">

                        <tr>
                            <td colspan="5" class="empty-state">
                                Loading managers...
                            </td>
                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</section>


<!-- ==========================================================
     STAFF MODAL
========================================================== -->

<div class="modal fade" id="staffModal" tabindex="-1">

    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title" id="staffModalTitle">
                    Add Manager
                </h5>

                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>

            </div>


            <div class="modal-body">

                <input type="hidden" id="staffId">

                <div class="mb-3">

                    <label class="form-label">
                        Parent Manager
                    </label>

                    <select id="staffParentId" class="form-select">
                        <option value="">
                            Select parent
                        </option>
                    </select>

                    <small class="text-muted">
                        The new manager will belong directly under this manager.
                    </small>

                </div>
                <div class="mb-3">

                    <label class="form-label">
                        Full Name
                    </label>

                    <input id="staffName" type="text" class="form-control" placeholder="Enter full name">

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Email
                    </label>

                    <input id="staffEmail" type="email" class="form-control" placeholder="Enter email">

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Mobile
                    </label>

                    <input id="staffMobile" type="text" class="form-control" placeholder="Enter mobile number">

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Password
                    </label>

                    <input id="staffPassword" type="password" class="form-control" placeholder="Enter password">

                    <small id="passwordHint" class="text-muted">
                        Required when creating.
                    </small>

                </div>


                <div class="form-check">

                    <input id="staffActive" class="form-check-input" type="checkbox" checked>

                    <label class="form-check-label" for="staffActive">
                        Active
                    </label>

                </div>

            </div>


            <div class="modal-footer">

                <button type="button" class="btn btn-light" data-bs-dismiss="modal">
                    Cancel
                </button>

                <button id="saveStaffBtn" type="button" class="btn btn-primary" onclick="saveStaff()">
                    Save Manager
                </button>

            </div>

        </div>

    </div>

</div>


<!-- ==========================================================
     PERMISSION MODAL
========================================================== -->

<div class="modal fade" id="permissionModal" tabindex="-1">

    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">
                    Manager Permissions
                </h5>

                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>

            </div>


            <div class="modal-body">

                <div id="permissionList" class="permission-list"></div>

            </div>


            <div class="modal-footer">

                <button type="button" class="btn btn-light" data-bs-dismiss="modal">
                    Cancel
                </button>

                <button id="savePermissionBtn" type="button" class="btn btn-primary" onclick="savePermissions()">
                    Save Permissions
                </button>

            </div>

        </div>

    </div>

</div>

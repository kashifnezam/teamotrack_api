<section class="staff-page">

    <div class="container-fluid">

        <div class="page-header">

            <div>
                <h4 class="mb-1">
                    HR
                </h4>

                <p class="text-muted mb-0">
                    Manage your HR hierarchy.
                </p>
            </div>

            <button
                class="btn btn-primary"
                onclick="openHrModal()"
            >
                <i class="bi bi-plus-lg me-1"></i>
                Add HR
            </button>

        </div>


        <div class="filter-card">

            <div class="row g-2 align-items-center">

                <div class="col-lg-6">

                    <div class="search-box">

                        <i class="bi bi-search"></i>

                        <input
                            id="hrSearch"
                            type="search"
                            class="form-control"
                            placeholder="Search HR..."
                        >

                    </div>

                </div>

                <div class="col-lg-6 text-lg-end">

                    <span class="staff-count">

                        <strong id="hrCount">
                            0
                        </strong>

                        HR

                    </span>

                </div>

            </div>

        </div>


        <div class="staff-card">

            <div class="staff-card-header">

                <h6 class="mb-0">
                    My HR
                </h6>

            </div>


            <div class="table-responsive">

                <table class="table align-middle mb-0">

                    <thead>

                        <tr>

                            <th>HR</th>
                            <th>Mobile</th>
                            <th>Status</th>

                            <th class="text-end">
                                Action
                            </th>

                        </tr>

                    </thead>


                    <tbody id="hrTable">

                        <tr>

                            <td
                                colspan="4"
                                class="empty-state"
                            >
                                Loading HR...
                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</section>


<!-- ==========================================================
     HR MODAL
========================================================== -->

<div
    class="modal fade"
    id="hrModal"
    tabindex="-1"
>

    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content">

            <div class="modal-header">

                <h5
                    class="modal-title"
                    id="hrModalTitle"
                >
                    Add HR
                </h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                ></button>

            </div>


            <div class="modal-body">

                <input
                    type="hidden"
                    id="hrId"
                >

                <div class="mb-3">

                    <label class="form-label">
                        Full Name
                    </label>

                    <input
                        id="hrName"
                        class="form-control"
                        placeholder="Enter full name"
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Email
                    </label>

                    <input
                        id="hrEmail"
                        type="email"
                        class="form-control"
                        placeholder="Enter email"
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Mobile
                    </label>

                    <input
                        id="hrMobile"
                        class="form-control"
                        placeholder="Enter mobile"
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Password
                    </label>

                    <input
                        id="hrPassword"
                        type="password"
                        class="form-control"
                        placeholder="Enter password"
                    >

                    <small
                        id="hrPasswordHint"
                        class="text-muted"
                    >
                        Required when creating.
                    </small>

                </div>


                <div class="form-check">

                    <input
                        id="hrActive"
                        type="checkbox"
                        class="form-check-input"
                        checked
                    >

                    <label
                        class="form-check-label"
                        for="hrActive"
                    >
                        Active
                    </label>

                </div>

            </div>


            <div class="modal-footer">

                <button
                    class="btn btn-light"
                    data-bs-dismiss="modal"
                >
                    Cancel
                </button>

                <button
                    id="saveHrBtn"
                    class="btn btn-primary"
                    onclick="saveHr()"
                >
                    Save HR
                </button>

            </div>

        </div>

    </div>

</div>
